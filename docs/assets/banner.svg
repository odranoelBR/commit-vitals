      <circle cx="310" cy="116" r="8"/><circle cx="370" cy="118" r="8"/><circle cx="420" cy="120" r="8"/>
    </g>
    <circle cx="250" cy="26" r="11" fill="#ff6b6b" stroke="#1b1f2b" stroke-width="3"/>
    <text x="268" y="22" fill="#ff8b8b" font-family="ui-monospace, Menlo, monospace" font-size="18">LCP +1.5 s · 0f3a8c1</text>
    <text x="300" y="98" fill="#f0a63a" font-family="ui-monospace, Menlo, monospace" font-size="15" opacity=".9">budget</text>
