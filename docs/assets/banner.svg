    <line x1="0" y1="80" x2="430" y2="80" stroke="#f0a63a" stroke-width="2" stroke-dasharray="7 6" opacity=".8"/>
    <path d="M10 112 L70 110 L130 108 L190 106 L250 26 L310 116 L370 118 L420 120 L420 150 L10 150 Z" fill="url(#fade)"/>
