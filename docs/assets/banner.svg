      <stop offset="0" stop-color="#14161c"/>
      <stop offset="1" stop-color="#1d2230"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c9cff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6c9cff" stop-opacity="0"/>
